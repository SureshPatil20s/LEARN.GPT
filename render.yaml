# Render Blueprint — https://docs.render.com/blueprint-spec
services:
  - type: web
    name: learn-gpt-backend
    runtime: python          # "runtime" replaces the deprecated "env" field
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn server.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION   # Explicit Python version (runtime.txt also present as fallback)
        value: "3.12.8"
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADDITIONAL_CORS_ORIGINS
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
