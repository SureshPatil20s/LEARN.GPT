services:
  - type: web
    name: learn-gpt-backend
    env: python
    runtime: python-3.12.8
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python -m uvicorn server.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ADDITIONAL_CORS_ORIGINS
        sync: false
      - key: HF_TOKEN
        sync: false
